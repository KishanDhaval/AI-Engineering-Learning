[project]
name = "strapi-hr-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kishandhaval", email = "kmprajapati1910@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3.15",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.2",
    "streamlit>=1.65.0",
]

[project.scripts]
strapi-hr-assistant = "strapi_hr_assistant:main"

[tool.uv]
package = false


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
